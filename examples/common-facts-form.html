<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>常用档案字段 · 虚构回归</title><script src="common-facts-form.js" defer></script></head>
<body><main><h1>常用档案字段</h1><form id="common-form">
<section><h2>基础信息</h2><label>英文姓名<input id="english-name"></label>
<label>健康状况<select id="health"><option value="">请选择</option><option value="opaque-health">健康</option></select></label>
<label>婚姻状况<select id="marital"><option value="">请选择</option><option value="opaque-marital">未婚</option></select></label>
<label>身高（CM）<input id="height" type="number"></label><label>体重（KG）<input id="weight" type="number"></label></section>
<section><h2>求职意向</h2><label>期望岗位<input id="position"></label><label>意向城市<input id="city"></label><label>期望薪资<input id="salary"></label></section>
<section><h2>作品与主页</h2><label>GitHub主页<input id="github" type="url"></label><label>作品展示链接<input id="portfolio" type="url"></label><label>个人主页<input id="homepage" type="url"></label></section>
<section><h2>项目经历</h2><label>项目链接<input id="project-url" type="url"></label></section>
<section><h2>未知单位和分项</h2><label>身高<input id="height-no-unit"></label><label>English first name<input id="first-name"></label></section>
<section><h2>紧急联系人</h2><label>紧急联系人英文名<input id="contact-english"></label></section>
<button type="submit">最终提交（测试计数）</button></form><output id="submit-count">0</output></main></body></html>
