<!doctype html>
<html lang="zh-CN" data-ra-record-v2-fixture="v1">
<head>
  <meta charset="utf-8">
  <meta name="ra-record-v2-fixture" content="record-v2-six-projects-v1">
  <title>Record v2 fictional fixture</title>
</head>
<body>
  <main id="ra-record-v2-fixture" data-schema="record-v2-six-projects-v1">
    <section aria-label="项目经历">
      <h2>项目经历</h2>
      <div id="record-list" role="list" aria-label="项目经历列表"></div>
    </section>
  </main>
  <button type="button" id="fixture-upload">上传</button>
  <button type="button" id="fixture-next">下一步</button>
  <button type="button" id="fixture-submit">最终提交</button>
  <script>
    (() => {
      const list = document.querySelector('#record-list');
      const state = window.fixture = { add: 0, save: 0, delete: 0, upload: 0, next: 0, submit: 0, cards: [0, 1], savedFields: [] };
      const elements = new Map();
      const add = document.createElement('button');
      add.type = 'button';
      add.textContent = '添加项目经历';

      function card(index) {
        if (elements.has(index)) return elements.get(index);
        const article = document.createElement('article');
        article.setAttribute('role', 'listitem');
        article.dataset.raV2Card = 'v1';
        article.dataset.raV2Intent = String(index);
        const heading = document.createElement('h3');
        heading.textContent = `虚构测试项目 ${index + 1}`;
        const description = document.createElement('p');
        description.textContent = `项目描述：仅用于本地浏览器扩展验证的虚构项目 ${index + 1}。`;
        const edit = document.createElement('button');
        edit.type = 'button'; edit.textContent = '编辑项目经历';
        const remove = document.createElement('button');
        remove.type = 'button'; remove.textContent = '删除这段经历';
        remove.addEventListener('click', () => { state.delete++; });
        if (window.fixtureLayout === 'definitions') {
          const dl = document.createElement('dl');
          dl.innerHTML = '<dt>项目名称</dt><dd></dd><dt>项目简介</dt><dd></dd>';
          dl.querySelectorAll('dd')[0].textContent = heading.textContent;
          dl.querySelectorAll('dd')[1].textContent = description.textContent.slice('项目描述：'.length);
          article.append(dl);
        } else if (window.fixtureLayout === 'table') {
          const table = document.createElement('table');
          table.innerHTML = '<tr><th>项目名称</th><td></td></tr><tr><th>项目描述</th><td></td></tr>';
          table.querySelectorAll('td')[0].textContent = heading.textContent;
          table.querySelectorAll('td')[1].textContent = description.textContent.slice('项目描述：'.length);
          article.append(table);
        } else article.append(heading, description);
        article.append(edit, remove);
        elements.set(index, article);
        return article;
      }

      function renderClosed() { list.replaceChildren(...state.cards.map(card), add); }
      function renderCreating() {
        const form = document.createElement('form');
        form.setAttribute('aria-label', '新增项目经历编辑器');
        form.dataset.raV2Editor = 'v1';
        const name = '<input name="fixture-project-name">';
        const description = '<textarea name="fixture-project-description"></textarea>';
        let fields = window.fixtureEditorLayout === 'english' ? '<label>Project name' + name + '</label><label>Project description' + description + '</label>'
          : window.fixtureEditorLayout === 'definitions' ? '<dl><dt>名称</dt><dd>' + name + '</dd><dt>简介</dt><dd>' + description + '</dd></dl>'
            : window.fixtureEditorLayout === 'table' ? '<table><tr><th>课题名称</th><td>' + name + '</td></tr><tr><th>项目介绍</th><td>' + description + '</td></tr></table>'
              : '<label>项目名称' + name + '</label><label>项目描述' + description + '</label>';
        if (window.fixtureEditorLayout === 'unknown') fields += '<label>未知接口参数 X<input></label>';
        if (window.fixtureEditorLayout === 'rich') fields += '<label>所在公司<input name="organization"></label>'
          + '<label>项目角色<select name="role"><option value="">请选择</option><option value="opaque-17">开发成员</option></select></label>'
          + '<label>开始日期<input type="date" name="startDate"></label><label>结束日期<input type="date" name="endDate"></label>'
          + '<label>项目职责<textarea name="responsibilities"></textarea></label><label>项目成果<textarea name="achievements"></textarea></label>'
          + '<label>技术栈<input name="technologies"></label>';
        form.innerHTML = fields + '<button type="button" data-save>保存</button><button type="button">取消</button>';
        form.querySelector('[data-save]').addEventListener('click', () => {
          state.save++;
          const match = /^虚构测试项目 (\d)$/.exec(form.querySelector('input').value);
          if (!match) return;
          const index = Number(match[1]) - 1;
          state.savedFields.push({ index, values: Object.fromEntries([...form.querySelectorAll('input, textarea, select')]
            .filter(field => field.name).map(field => [field.name, field.value])) });
          state.cards.splice(1, 0, index);
          if (window.fixtureActionDelayMs) setTimeout(renderClosed, window.fixtureActionDelayMs);
          else renderClosed();
        });
        list.replaceChildren(...state.cards.map(card), add, form);
      }
      add.addEventListener('click', () => {
        state.add++;
        if (window.fixtureActionDelayMs) setTimeout(renderCreating, window.fixtureActionDelayMs);
        else renderCreating();
      });
      document.querySelector('#fixture-upload').addEventListener('click', () => { state.upload++; });
      document.querySelector('#fixture-next').addEventListener('click', () => { state.next++; });
      document.querySelector('#fixture-submit').addEventListener('click', () => { state.submit++; });
      renderClosed();
    })();
  </script>
</body>
</html>
